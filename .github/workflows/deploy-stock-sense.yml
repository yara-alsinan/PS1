name: Deploy Stock Sense

on:
  push:
    branches: [main]
    paths:
      - "DataDemo/**"
      - ".github/workflows/deploy-stock-sense.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Stock Sense
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./DataDemo"
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
